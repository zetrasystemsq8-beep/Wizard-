name: Social publisher tests

on:
  pull_request:
    paths: ["social_publisher/**"]
  push:
    paths: ["social_publisher/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: social_publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v
